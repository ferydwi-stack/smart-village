user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Configuration
    gzip on;
    gzip_types application/json application/javascript text/css;
    # Note: text/html is always compressed by default when gzip is on.

    # Client body size limit (for image uploads)
    client_max_body_size 10M;

    # Proxy Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Upstream Servers
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8080;
    }

    upstream nlp-service {
        server nlp-service:8000;
    }

    # HTTP Server (Port 80)
    server {
        listen 80;
        server_name localhost;

        # Common proxy headers applied to all proxy_pass
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. / -> proxy to frontend (Next.js)
        location / {
            proxy_pass http://frontend;
        }

        # 4. /_next/static/* -> proxy to frontend (static assets)
        location /_next/static/ {
            proxy_pass http://frontend;
        }

        # 2. /api/v1/* -> proxy to backend (Go/Fiber)
        location /api/v1/ {
            proxy_pass http://backend;
        }

        # 3. /api/v1/chat/* -> proxy to backend (which internally calls nlp-service)
        # This is handled by the /api/v1/ location above, but listed here explicitly if needed.
        # location /api/v1/chat/ {
        #     proxy_pass http://backend;
        # }

        # 5. /uploads/* -> proxy to backend (Go/Fiber) serving static files
        location /uploads/ {
            proxy_pass http://backend;
        }
    }

    # HTTPS Server (Port 443) - Commented out for future Let's Encrypt setup
    # server {
    #     listen 443 ssl;
    #     server_name localhost;
    # 
    #     # SSL Certificate Paths
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # 
    #     # SSL Optimization
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
