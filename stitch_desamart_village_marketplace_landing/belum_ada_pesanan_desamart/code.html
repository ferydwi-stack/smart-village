<div class="relative w-48 h-48 mb-lg">

<div class="absolute inset-0 bg-surface-container-low rounded-full scale-90"></div>
<!-- Empty Box Image -->
<div class="relative flex items-center justify-center h-full">

</div>
</div>
</div>
<!-- Typography -->
<div class="space-y-sm">
<h1 class="font-h2 text-primary">Belum Ada Pesanan</h1>
<p class="font-body-md text-on-surface-variant px-md">Anda belum melakukan pemesanan. Mulai belanja sekarang!</p>
</div>
<!-- CTA Button -->
<div class="pt-xl w-full">
<button class="w-full bg-primary text-white font-h3 py-md px-lg rounded-xl flex items-center justify-center gap-sm group hover:bg-primary-container transition-all active:scale-95 shadow-md">
                            Mulai Belanja
                            <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Trust Badge Section -->
<div class="flex items-center justify-center gap-md pt-lg">
<div class="flex items-center gap-xs px-md py-sm bg-surface-container rounded-full">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-sm text-on-surface-variant">Petani Terverifikasi</span>
</div>
