</div>
<div class="flex items-center gap-4">
<button class="p-2 text-stone-600 hover:bg-stone-100 transition-colors active:scale-95 duration-150 rounded-full">

</button>

<img class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="stylized vector illustration of an empty sunlit grassy field with a floating glass magnifying glass hovering over green grass" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCYcFG_VZQBg7ZHGn06679Mp9H7cSq0Z5p461s3fEsyWoJlAGy774QsgTTsiAMAYbbM1mfz8POZOUxMPigzceVg9mrdO8F5zUSM0MP8LeeMBJrFG_wgR2YJCQi1AUwau6TnRLjqkQ74p10B9-HZeR7Q34I9MXLk7eomBExHPpyRyNjbiQXNa3_lB2x7NPff_M6ta3NFQA977CjK_6S1iG6T17cfqVwaQ-JpOz_e_ynH2JOuclAzJzVNBtZq5Yq1WCzlkqd_7C3Nm90"/>
<div class="relative z-10 bg-white/40 backdrop-blur-md p-md rounded-full border border-white/50">
<span class="material-symbols-outlined text-[80px] text-primary" data-icon="search" style="font-variation-settings: 'wght' 200;">search</span>
</div>
</div>
<!-- Text Content -->
<h2 class="font-h3 text-h3 text-on-surface mb-sm">Produk Tidak Ditemukan</h2>
<p class="font-body-md text-on-surface-variant max-w-[320px] mb-lg">
                    Coba kata kunci lain atau jelajahi kategori produk untuk menemukan apa yang Anda cari.
                </p>
<!-- CTA Button -->
<button class="bg-primary hover:bg-primary-container text-white px-lg py-3 rounded-full font-label-sm transition-all active:scale-95 flex items-center gap-2 group">
                    Lihat Semua Produk
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Suggestion Chips -->
<div class="mt-xl w-full max-w-lg">
<p class="font-label-sm text-stone-500 mb-md uppercase tracking-wider">Mungkin Anda Mencari</p>
<div class="flex flex-wrap justify-center gap-sm">
<span class="px-md py-1.5 bg-secondary-container text-on-secondary-container rounded-full text-label-sm font-semibold border border-outline-variant/30 cursor-pointer hover:bg-secondary-fixed transition-colors">Beras Organik</span>
<span class="px-md py-1.5 bg-secondary-container text-on-secondary-container rounded-full text-label-sm font-semibold border border-outline-variant/30 cursor-pointer hover:bg-secondary-fixed transition-colors">Sayur Segar</span>

<span class="text-[11px] font-semibold font-['Plus_Jakarta_Sans']">Pesanan</span>
