    background-color: #fff9ec;

    position: relative

    content: "";

    inset: 0;
    opacity: 0.03;

<body class="bg-background font-body-md text-on-surface min-h-screen flex items-center justify-center village-pattern p-margin-mobile md:p-0">
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(93,64,55,0.08)] overflow-hidden transition-all duration-300">
<div class="px-xl py-xl md:px-xl md:py-xl">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-xl">
<div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h1 class="font-h3 text-h3 text-primary-container">DesaMart</h1>
</div>
<!-- Header Text -->
<div class="text-center mb-xl">
<h2 class="font-h3 text-h3 text-primary mb-xs">Selamat Datang Kembali</h2>
<p class="font-body-md text-on-surface-variant">Masuk ke akun DesaMart Anda</p>
</div>
<!-- Login Form -->
<form class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-body-lg">mail</span>
</div>
<input class="w-full h-12 pl-11 pr-md bg-surface-variant/30 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md placeholder:text-outline" id="email" name="email" placeholder="nama@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Kata Sandi</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-body-lg">lock</span>
</div>
<input class="w-full h-12 pl-11 pr-11 bg-surface-variant/30 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md placeholder:text-outline" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-body-lg">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between py-xs">
<label class="flex items-center space-x-sm cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 transition-all" type="checkbox"/>
<span class="font-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Ingat saya</span>
</label>
<a class="font-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Lupa kata sandi?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary-container text-on-primary font-label-sm rounded-lg shadow-sm hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Masuk
                </button>
</form>
<!-- Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-md bg-surface-container-lowest text-on-surface-variant font-label-sm">atau</span>
</div>
</div>
<!-- Footer Text -->
<div class="text-center">
<p class="font-body-md text-on-surface-variant">
                    Belum punya akun? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4 transition-all" href="#">Daftar sekarang</a>
</p>
</div>
</div>
<!-- Extra Village Context (Decorative Footer inside Card) -->
<div class="bg-surface-container px-xl py-md border-t border-outline-variant/30 flex items-center justify-center gap-md">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="text-[12px] font-semibold text-on-secondary-fixed-variant uppercase tracking-wider">Aman &amp; Terpercaya</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
<span class="text-[12px] font-semibold text-on-secondary-fixed-variant uppercase tracking-wider">Kirim ke Desa</span>
</div>
</div>
</main>
<!-- Global Footer Component -->
<footer class="fixed bottom-0 left-0 right-0 hidden md:block">
<div class="flex flex-col md:flex-row justify-between items-center px-8 py-8 w-full max-w-7xl mx-auto">
<p class="text-sm font-['Plus_Jakarta_Sans'] text-stone-600 dark:text-stone-400">© 2024 DesaMart. Membangun Ekonomi Desa.</p>
<div class="flex gap-lg">
<a class="text-sm font-['Plus_Jakarta_Sans'] text-stone-600 hover:text-green-700 transition-colors" href="#">Bantuan</a>
<a class="text-sm font-['Plus_Jakarta_Sans'] text-stone-600 hover:text-green-700 transition-colors" href="#">Privasi</a>
<a class="text-sm font-['Plus_Jakarta_Sans'] text-stone-600 hover:text-green-700 transition-colors" href="#">Syarat &amp; Ketentuan</a>
</div>
</div>
</footer>
</body></html>
