<header class="bg-stone-50 dark:bg-stone-900 border-b border-stone-200/40 dark:border-stone-800 shadow-sm flex justify-between items-center w-full px-4 h-16 z-50 fixed top-0 antialiased font-['Plus_Jakarta_Sans']">

<div class="mb-lg flex justify-center">
<div class="relative w-48 h-48 md:w-56 md:h-56">
<img alt="Friendly character with empty basket" class="w-full h-full object-contain" data-alt="Illustration of a friendly Indonesian village farmer holding a woven bamboo basket with a confused expression and floating question mark, warm earth tones, soft digital art style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRSsC-lDjOyqwhA7sy525LqzitquIm5W17zXxEpxvD1v2_CVpvfT7sZ1pMMYsxVw_q_f0J0xVhSMUmvunOibdl8sF1DIR81ra1uhRZtEzfTsC3yyl5uGu_5oihX9TjoMpQbuDd08w9611puaGyz-mz1nPrwOsSHKIZ-YceyXWRv3a8o4FwnxRq582w5zPU1ey0ZgC05OmMGBfDjWo9Bhg5lyUl89yDXcwixLKzFvhkCs4rIbOEu6w20tAOxcrJb2-uyOFVdoFY0Jc"/>

<p class="font-body-md text-body-md text-on-surface-variant mb-lg px-sm">
                    Yuk, jelajahi produk desa dan temukan yang Anda butuhkan!
                </p>
<!-- CTA Button -->
<div class="flex flex-col gap-sm">
<button class="bg-primary text-on-primary font-label-sm py-md px-lg rounded-xl flex items-center justify-center gap-sm pressed-effect transition-all shadow-md hover:bg-primary-container">
                        Lihat Marketplace
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="bg-transparent text-secondary font-label-sm py-md px-lg rounded-xl border border-secondary/20 hover:bg-secondary/5 transition-all pressed-effect mt-2">
                        Lihat Daftar Keinginan
                    </button>
</div>
<!-- Village Trust Badge -->
<div class="mt-xl pt-lg border-t border-stone-100 flex items-center justify-center gap-sm">
<div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="verified" data-weight="fill">verified</span>
</div>
<span class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Mendukung Petani Lokal</span>
</div>
</div>
